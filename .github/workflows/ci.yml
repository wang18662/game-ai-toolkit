name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov
      - name: Lint
        run: ruff check src tests || true
      - name: Test with coverage
        run: pytest --cov=src/gameai --cov-fail-under=85

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install vcpkg deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtest-dev
      - name: Build & test (C++ port)
        working-directory: cpp
        run: |
          cmake -S . -B build
          cmake --build build -j
          cd build && ctest --output-on-failure
      - name: Install Python (for parity check)
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .
      - name: Cross-language parity
        run: pytest tests/test_parity.py -q
