name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov
      - name: Lint
        run: ruff check src tests || true
      - name: Test with coverage
        run: pytest --cov=src/gameai --cov-fail-under=85

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
          cmake --version
          g++ --version
      - name: Configure
        working-directory: cpp
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        working-directory: cpp
        run: cmake --build build -j"$(nproc)"
      - name: Unit tests
        working-directory: cpp/build
        run: ctest --output-on-failure
      - name: Install Python (for parity check)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .
      - name: Cross-language parity
        run: pytest tests/test_parity.py -q
